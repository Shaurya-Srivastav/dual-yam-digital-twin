name: sim-only

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install the packages this job imports
        run: pip install numpy scipy
      - name: checks that do not load MuJoCo
        run: python tests/test_offline.py
